<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobTrace — interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6fa; --ink:#101322; --muted:#5b6472; --border:#e4e7ee;
    --surface:#ffffff; --glass:rgba(255,255,255,.55); --track:#eceef4;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 18px 45px -12px rgba(16,24,40,.14);
  }
  :root[data-theme="dark"]{
    --bg:#0a0c11; --ink:#e8eaf0; --muted:#98a0b0; --border:#20242e;
    --surface:#12151c; --glass:rgba(24,28,38,.5); --track:#191d26;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 55px -14px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0a0c11; --ink:#e8eaf0; --muted:#98a0b0; --border:#20242e;
      --surface:#12151c; --glass:rgba(24,28,38,.5); --track:#191d26;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 55px -14px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  }
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
  .bg::before,.bg::after{content:"";position:absolute;width:44vw;height:44vw;border-radius:50%;filter:blur(90px);opacity:.4}
  .bg::before{background:#6366f1;top:-12vw;left:-8vw}
  .bg::after{background:#0d9488;bottom:-16vw;right:-10vw}
  a{color:inherit}
  h1,h2,h3,.brand{font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.02em}

  .layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);border-right:1px solid var(--border);
  }
  .brand{font-weight:700;font-size:19px;margin:2px 6px 4px}
  .demobadge{margin:0 6px 6px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:#6366f1;background:color-mix(in srgb,#6366f1 16%,transparent);border:1px solid color-mix(in srgb,#6366f1 35%,transparent);border-radius:999px;padding:3px 9px;display:inline-block}
  .brand b{color:#6366f1}
  .sidelbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
  .nav a:hover{background:var(--track);color:var(--ink)}
  .nav a.on{background:#6366f1;color:#fff}
  .nav a .x{margin-left:auto;opacity:0;font-size:12px;border:0;background:transparent;color:inherit;cursor:pointer;padding:2px 5px;border-radius:6px}
  .nav a:hover .x{opacity:.6}
  .nav a .x:hover{opacity:1;background:rgba(255,255,255,.2)}
  .side-foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .side-foot button,.side-foot a{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
  .side-foot button:hover,.side-foot a:hover{color:var(--ink)}

  .demobanner{grid-column:1/-1;background:color-mix(in srgb,#6366f1 12%,var(--surface));border-bottom:1px solid var(--border);padding:9px clamp(18px,3vw,46px);font-size:12.5px;color:var(--muted)}
  .demobanner a{color:#6366f1;text-decoration:none;font-weight:600}
  .demobanner a:hover{text-decoration:underline}
  main{padding:26px clamp(18px,3vw,46px) 90px;min-width:0}
  .phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .phead h1{font-size:22px;margin:0}
  .phead .sub{color:var(--muted);font-size:13px}

  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .metric{
    --a:#6366f1;position:relative;border-radius:18px;padding:18px 18px 15px;
    background:var(--glass);
    background:color-mix(in srgb,var(--a) 24%,var(--glass));
    border:1px solid var(--border);
    border:1px solid color-mix(in srgb,var(--a) 45%,transparent);
    backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
    box-shadow:0 10px 34px -10px color-mix(in srgb,var(--a) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.18);
  }
  .metric .v{font-size:29px;font-weight:700;font-family:'Space Grotesk','Inter';line-height:1}
  .metric .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;margin-top:8px;opacity:.85}
  .metric{cursor:pointer;transition:transform .08s}
  .metric:hover{transform:translateY(-1px)}
  .metric.on{outline:2px solid var(--a);outline-offset:2px}

  .panel{border-radius:18px;padding:22px 24px;margin-bottom:16px;background:var(--glass);border:1px solid var(--border);
    backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow)}
  .panel h3{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:16px}
  .cols>.panel{height:520px;display:flex;flex-direction:column;margin-bottom:0}
  .cols>.panel .scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px}

  .feed{list-style:none;margin:0;padding:0}
  .feed li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .feed li:last-child{border-bottom:0}
  .feed li.off{opacity:.3}
  .feed li.hit b{color:inherit}
  .feed li.hit .d,.feed li.hit .r{color:inherit;opacity:.7}
  .feed .d{display:inline-block;min-width:50px;color:var(--muted);font-variant-numeric:tabular-nums}
  .feed .r{color:var(--muted)}

  /* status breakdown */
  .fchip{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:12px;background:var(--track);
    border-radius:999px;padding:2px 4px 2px 10px;display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
  .fchip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:999px;line-height:1}
  .fchip button:hover{color:var(--ink);background:var(--border)}
  .brow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;padding:8px 6px;border-radius:9px;cursor:pointer}
  .brow:hover{background:var(--track)}
  .brow.sel{background:var(--track);outline:1px solid var(--border)}
  .brow.dim{opacity:.3}
  .blabel{font-weight:500;font-size:13.5px;min-width:104px;flex:none}
  .bcount{font-weight:700;font-family:'Space Grotesk','Inter';font-variant-numeric:tabular-nums;font-size:13px;min-width:46px;text-align:right}
  .bcount em{font-style:normal;color:var(--muted);font-weight:600}
  .bbar{flex:1;height:12px;border-radius:6px;background:var(--track);overflow:hidden;max-width:320px}
  .bbar span{display:block;height:100%;border-radius:6px}

  .chart{display:flex;align-items:flex-end;gap:5px;height:150px}
  .bw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bc{width:64%;border-radius:5px 5px 0 0;background:linear-gradient(#818cf8,#6366f1);min-height:3px}
  .bl{font-size:10px;color:var(--muted);white-space:nowrap}
  .bv{font-size:11px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;white-space:nowrap}
  tbody tr:hover{background:var(--track)}
  td .co{font-weight:600}
  td a.jd{color:#6366f1;text-decoration:none;font-weight:600}
  td a.jd:hover{text-decoration:underline}
  .addlink{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline dotted}
  .addlink:hover{color:#6366f1}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
  .pencil{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;padding:3px 7px;border-radius:6px}
  .pencil:hover{color:var(--ink);background:var(--track)}
  .tablewrap{overflow-x:auto}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px}

  dialog{border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;max-width:420px;width:92vw;box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 14px;font-size:16px}
  dialog label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px;color:var(--muted)}
  dialog input,dialog select{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
  dialog .row{display:flex;gap:10px;margin-top:18px}
  dialog .row button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);font:inherit;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink)}
  dialog .row button.primary{background:#6366f1;border-color:#6366f1;color:#fff}
  dialog .danger{margin-top:14px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  dialog .danger input{width:auto}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  #toast.show{opacity:.95}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="layout">
  <div class="demobanner">Portfolio demo of <b>JobTrace</b> — a multi-user job-application tracker. All data below is synthetic. The live version reads Gmail over OAuth, classifies mail with an LLM, and runs an hourly worker on GitHub Actions. &nbsp;<a href="../">← back to portfolio</a></div>
  <aside class="sidebar">
    <div class="brand">Job<b>Trace</b></div>
    <div class="demobadge">DEMO · sample data</div>
    <div class="sidelbl">Trackers</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button id="addBtn" type="button">＋ Add a tracker</button>
      <button id="themeBtn" type="button">◐ Theme</button>
    </div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<dialog id="dlg">
  <h3>Edit — <span id="dlgCo"></span></h3>
  <label>Role / title</label>
  <input id="dlgRole" placeholder="e.g. Senior Data Analyst">
  <label>Job description link</label>
  <input id="dlgLink" placeholder="https://…  (blank to clear)">
  <label>Status override</label>
  <select id="dlgStatus">
    <option value="">— auto —</option>
    <option value="waiting">Waiting</option>
    <option value="in_progress">In progress</option>
    <option value="assessment">Assessment</option>
    <option value="interviewing">Interviewing</option>
    <option value="offer">Offer</option>
    <option value="rejected">Rejected</option>
    <option value="ghosted">Ghosted</option>
  </select>
  <label class="danger"><input type="checkbox" id="dlgHide">Remove this application from tracking</label>
  <div class="row">
    <button type="button" id="dlgCancel">Cancel</button>
    <button type="button" id="dlgSave" class="primary">Save</button>
  </div>
</dialog>

<div id="toast"></div>

  function fmtDate(iso){

  function weekly(list){

        ? '<a class="jd" href="'+esc(a.jd_link)+'" target="_blank" rel="noopener">'+esc(roles)+'</a>'
        : (roles!=="—"?esc(roles)+' ':'')+'<button class="addlink" data-edit="'+esc(a.company)+'">＋ link</button>';
      return '<tr><td><span class="co">'+esc(a.company)+'</span></td><td>'+roleCell+'</td>'+
        '<td>'+esc(a.applied_at||"—")+'</td>'+
        '<td><span class="pill" style="background:'+meta[1]+'">'+meta[0]+'</span></td>'+
        '<td>'+esc(lastActivity(a)||"—")+'</td>'+
        '<td style="text-align:right"><button class="pencil" data-edit="'+esc(a.company)+'" title="Edit">✎</button></td></tr>';
    }).join("")||'<tr><td colspan="6" class="r">No applications tracked yet.</td></tr>';

    var legend=Object.keys(STATUS).map(function(k){return '<span><i style="background:'+STATUS[k][1]+'"></i>'+STATUS[k][0]+'</span>';}).join("");
    var hint=withoutLink?' &nbsp;·&nbsp; <span class="r">'+withoutLink+' without a link — click ＋ link or ✎ to add</span>':'';

    document.getElementById("main").innerHTML=
      '<div class="phead"><h1>'+esc(DATA.name)+'</h1>'+
        '<span class="sub">'+esc(DATA.email)+(DATA.updated_at?' · updated '+fmtDate(DATA.updated_at):"")+'</span></div>'+
      '<div class="metrics">'+cards+'</div>'+
      '<div class="cols">'+
        '<div class="panel"><div id="bdhead"></div><div class="scroll" id="bd"></div></div>'+
        '<div class="panel"><h3>Recent activity</h3><div class="scroll"><ul class="feed" id="feed"></ul></div></div></div>'+
      '<div class="panel"><h3>Applications per week</h3><div class="chart">'+bars+'</div></div>'+
      '<div class="panel"><h3>All applications ('+list.length+')'+hint+'</h3><div class="tablewrap"><table>'+
        '<thead><tr><th>Company</th><th>Role</th><th>Applied</th><th>Status</th><th>Last activity</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table></div>'+
        '<div class="legend">'+legend+'</div></div>';

    paint();

    document.querySelectorAll(".metric[data-f]").forEach(function(el){
      el.addEventListener("click",function(){setCardFilter(el.getAttribute("data-f"));});
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click",function(){openEdit(b.getAttribute("data-edit"));});
    });
  }

  var dlg=document.getElementById("dlg");
  function openEdit(company){
    var apps=displayApps(), rec=apps[normKey(company)]||{roles:[]};
    var ov=(DATA.manual_overrides||{})[company]||{};
    document.getElementById("dlgCo").textContent=company;
    document.getElementById("dlgRole").value=ov.role||(rec.roles&&rec.roles[0])||"";
    document.getElementById("dlgLink").value=ov.jd_link||rec.jd_link||"";
    document.getElementById("dlgStatus").value=ov.status||rec.status_override||"";
    document.getElementById("dlgHide").checked=!!ov.hide;
    dlg._company=company;
    dlg.showModal();
  }
  document.getElementById("dlgCancel").addEventListener("click",function(){dlg.close();});
  document.getElementById("dlgSave").addEventListener("click",function(){
    var body={slug:SLUG,company:dlg._company,
      role:document.getElementById("dlgRole").value.trim(),
      jd_link:document.getElementById("dlgLink").value.trim(),
      status:document.getElementById("dlgStatus").value,
      hide:document.getElementById("dlgHide").checked};
    DATA.manual_overrides=DATA.manual_overrides||{};
    var entry={};
    if(body.role)entry.role=body.role;
    if(body.jd_link)entry.jd_link=body.jd_link;
    if(body.status)entry.status=body.status;
    if(body.hide)entry.hide=true;
    if(Object.keys(entry).length)DATA.manual_overrides[dlg._company]=entry;
    else delete DATA.manual_overrides[dlg._company];
    dlg.close();renderDash();
    toast("Saved for this session — the demo resets on reload.");
  });

  function removePerson(slug,name){
    if(!confirm('Remove the demo tracker for '+name+'? (Resets on reload.)'))return;
    delete DEMO[slug];
    Object.keys(DEMO).forEach(function(k){
      DEMO[k].people=(DEMO[k].people||[]).filter(function(p){return p.slug!==slug;});
    });
    if(slug===SLUG){go(Object.keys(DEMO)[0]);}
    else{DATA.people=(DATA.people||[]).filter(function(p){return p.slug!==slug;});renderSidebar();}
    toast("Removed "+name+" (demo — resets on reload).");
  }

  function renderSidebar(){
    var nav=document.getElementById("nav");
    var people=DATA.people||[{slug:SLUG,name:DATA.name}];
    nav.innerHTML=people.map(function(p){
      return '<a href="#'+esc(p.slug)+'" data-go="'+esc(p.slug)+'" class="'+(p.slug===SLUG?"on":"")+'">'+
        esc(p.name)+
        (p.slug===SLUG?"":'<button class="x" data-del="'+esc(p.slug)+'" data-name="'+esc(p.name)+'" title="Remove tracker">✕</button>')+
        '</a>';
    }).join("");
    nav.querySelectorAll("[data-go]").forEach(function(a){
      a.addEventListener("click",function(e){e.preventDefault();go(a.getAttribute("data-go"));});
    });
    nav.querySelectorAll(".x").forEach(function(btn){
      btn.addEventListener("click",function(e){
        e.preventDefault();e.stopPropagation();
        removePerson(btn.getAttribute("data-del"),btn.getAttribute("data-name"));
      });
    });
  }

  document.getElementById("themeBtn").addEventListener("click",function(){
    var r=document.documentElement,cur=r.getAttribute("data-theme");
    var next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
    r.setAttribute("data-theme",next);localStorage.setItem(THK,next);
  });
  (function(){var t=localStorage.getItem(THK);if(t)document.documentElement.setAttribute("data-theme",t);})();

  function load(){
    DATA=DEMO[SLUG]||DEMO[FIRST];
    renderSidebar();renderDash();
  }
  function go(slug){
    if(!DEMO[slug])return;
    SLUG=slug;FILTER=null;
    if(location.hash.slice(1)!==slug)location.hash=slug;
    load();window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",function(){
    var s=location.hash.slice(1);if(DEMO[s]&&s!==SLUG)go(s);
  });
  document.getElementById("addBtn").addEventListener("click",function(){
    toast("Enrolling a real inbox happens in the live app via Google sign-in — this is a static demo.");
  });
  load();
})();
</script>
</body>
</html>
